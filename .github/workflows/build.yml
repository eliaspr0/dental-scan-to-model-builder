name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        name: macOS-AppleSilicon }
          - { os: macos-13,        name: macOS-Intel }
          - { os: windows-latest,  name: Windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements-gui.txt pyinstaller
      - run: python packaging/make_icon.py
      - run: python -m PyInstaller packaging/dentalbase.spec --noconfirm
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: "'dist/Dental Base Model.app/Contents/MacOS/DentalBaseModel' --selftest"
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/DentalBaseModel/DentalBaseModel.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Dental Base Model.app" "DentalBaseModel-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DentalBaseModel -DestinationPath "DentalBaseModel-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DentalBaseModel-${{ matrix.name }}
          path: DentalBaseModel-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DentalBaseModel-${{ matrix.name }}.zip
