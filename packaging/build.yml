name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write      # lets the release step attach the zips

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        name: macOS-AppleSilicon }
          - { os: macos-15-intel,   name: macOS-Intel }
          - { os: windows-latest,  name: Windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements-gui.txt pyinstaller
      - run: python packaging/make_icon.py
      - run: python -m PyInstaller packaging/DentalScanToModelBuilder.spec --noconfirm
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: "'dist/Dental Scan to Model Builder.app/Contents/MacOS/DentalScanToModelBuilder' --selftest"
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/DentalScanToModelBuilder/DentalScanToModelBuilder.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Dental Scan to Model Builder.app" "DentalScanToModelBuilder-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DentalScanToModelBuilder -DestinationPath "DentalScanToModelBuilder-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DentalScanToModelBuilder-${{ matrix.name }}
          path: DentalScanToModelBuilder-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DentalScanToModelBuilder-${{ matrix.name }}.zip
